<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b8dfff"><title>Ilias Turns 5 | Toy Story Invitation</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf6ff;color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100dvh;display:grid;place-items:center}.shell{width:min(100%,560px);position:relative;text-align:center}.invite{display:block;width:100%;height:auto;box-shadow:0 8px 40px #0009}.overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#71b5e8,#e9f7ff 85%);display:grid;place-items:center;z-index:3;padding:24px;transition:opacity .7s,visibility .7s}.overlay.hide{opacity:0;visibility:hidden}.panel{max-width:380px;text-align:center}.web{font-size:62px;margin-bottom:10px}.panel h1{font-size:clamp(30px,8vw,48px);line-height:1.06;text-transform:uppercase;margin:0 0 15px;color:#ffcf35;text-shadow:3px 4px #3b0c0d}.panel p{line-height:1.5;margin-bottom:25px}button{border:0;border-radius:50px;background:#ffcf35;color:#163c67;padding:16px 25px;font-size:17px;font-weight:850;cursor:pointer;box-shadow:0 6px 0 #a7621b}button:active{transform:translateY(3px)}.invite.reveal{animation:appear 1s ease-out both}@keyframes appear{from{opacity:0;transform:scale(.9) translateY(25px)}to{opacity:1;transform:scale(1) translateY(0)}}.music{position:fixed;right:12px;bottom:12px;z-index:2;background:#fff;color:#92141d;box-shadow:0 2px 14px #0008;padding:10px 16px;font-size:14px}.music[hidden]{display:none}</style></head><body><main class="shell"><img id="invite" class="invite" src="invitation.png" alt="Ilias is turning 5! Toy Story birthday invitation."></main><div class="overlay" id="cover"><div class="panel"><div class="web">🤠🚀☁️</div><h1>You’ve Got a Friend in Ilias!</h1><p>Join us for Ilias’s 5th birthday!</p><button id="open" type="button">OPEN YOUR INVITATION ✨</button></div></div><button id="toggle" class="music" type="button" hidden>🔊 Music on</button><audio id="song" src="music.mp3" loop preload="auto"></audio><script>const cover=document.getElementById('cover'),invite=document.getElementById('invite'),song=document.getElementById('song'),toggle=document.getElementById('toggle');document.getElementById('open').addEventListener('click',async()=>{cover.classList.add('hide');invite.classList.add('reveal');toggle.hidden=false;try{await song.play();toggle.textContent='🔊 Music on'}catch(e){toggle.textContent='▶ Play music'}});toggle.addEventListener('click',async()=>{if(song.paused){try{await song.play();toggle.textContent='🔊 Music on'}catch(e){toggle.textContent='▶ Play music'}}else{song.pause();toggle.textContent='🔇 Music off'}});</script></body></html>
